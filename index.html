<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emanoelle Vasconcelos — Designer e Artista Gráfica</title>
<meta name="description" content="Portfólio de design gráfico, identidade visual, direção de arte e comunicação por Emanoelle Vasconcelos.">
<meta property="og:type" content="website">
<meta property="og:title" content="Emanoelle Vasconcelos — Designer e Artista Gráfica">
<meta property="og:description" content="Portfólio de design gráfico, identidade visual e direção de arte.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#14161a;--muted:#666b73;--line:#e7e8ea;--soft:#f3f4f6;--accent:#2f4bff;--r:10px;--w:1320px;--pad:clamp(16px,4vw,48px)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,sans-serif;line-height:1.1;margin:0;letter-spacing:-.02em}
a{color:inherit}img{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:#fff;padding:8px;z-index:99}
.wrap{max-width:var(--w);margin:0 auto;padding:0 var(--pad)}
.hd{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd .wrap{display:flex;align-items:center;justify-content:space-between;height:72px;gap:16px}
.logo{font:700 1.25rem 'Bricolage Grotesque';text-decoration:none}.logo img{height:36px}
.nav{display:flex;align-items:center;gap:28px}.nav a{text-decoration:none;font-weight:500}
.nav a[aria-current]{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:2px}
.btn{background:var(--ink);color:#fff!important;padding:10px 20px;border-radius:99px;text-decoration:none!important;transition:background .2s}.btn:hover{background:var(--accent)}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
.hero{padding:clamp(48px,9vw,120px) 0 40px}
.hero h1{font-size:clamp(2.4rem,7vw,5.6rem);max-width:15ch;font-weight:700}
.hero p{max-width:52ch;color:var(--muted);font-size:1.125rem;margin:20px 0 0}
.filters{display:flex;gap:8px;overflow-x:auto;padding:8px 0 24px;scrollbar-width:none}
.filters button{flex:none;font:500 .95rem Figtree;border:1px solid var(--line);background:#fff;padding:8px 16px;border-radius:99px;cursor:pointer;transition:.2s}
.filters button:hover{border-color:var(--ink)}
.filters button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:36px 24px;padding-bottom:80px;animation:in .35s}
@keyframes in{from{opacity:0}}
.card{text-decoration:none}.card[hidden]{display:none}.thumb{aspect-ratio:4/3;border-radius:var(--r);overflow:hidden;background:var(--soft)}
.thumb img,.ph{width:100%;height:100%;object-fit:cover}
.thumb img{transition:transform .5s}.card:hover .thumb img{transform:scale(1.05)}
.card h3{font-size:1.1rem;margin-top:12px;font-weight:500}.card h3 span{color:var(--muted)}
.card .cat{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.ph{display:grid;place-items:center;background:hsl(var(--h) 55% 90%);color:hsl(var(--h) 45% 30%);font:700 2.5rem 'Bricolage Grotesque'}
.empty{color:var(--muted);padding:40px 0}
.back{display:inline-block;margin:32px 0 16px;color:var(--muted);text-decoration:none}.back:hover{color:var(--ink)}
.pj h1{font-size:clamp(2rem,5vw,3.8rem)}.pj .sub{color:var(--muted);margin:8px 0 32px}
.pj .cover{border-radius:var(--r);overflow:hidden;background:var(--soft);aspect-ratio:16/9}.pj .cover img{width:100%;height:100%;object-fit:cover}
.cols{display:grid;grid-template-columns:2fr 1fr;gap:48px;margin:48px 0}
.cols p{margin:0 0 1em;max-width:62ch;font-size:1.1rem}
dl{margin:0}dt{color:var(--muted);font-size:.85rem}dd{margin:0 0 16px;font-weight:500}
.gallery{columns:2;column-gap:20px}.gallery button{display:block;width:100%;margin:0 0 20px;padding:0;border:0;background:var(--soft);border-radius:var(--r);overflow:hidden;cursor:zoom-in;break-inside:avoid}
.gallery img{width:100%;height:auto;min-height:160px}.gallery .ph{aspect-ratio:4/3}
.pn{display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--line);margin-top:56px;padding:24px 0 80px}.pn a{text-decoration:none;font:500 1.2rem 'Bricolage Grotesque'}
dialog{border:0;background:none;padding:0;max-width:96vw;max-height:96vh}dialog::backdrop{background:rgba(0,0,0,.85)}dialog img{max-height:92vh;border-radius:var(--r)}
.ab p{max-width:62ch;font-size:1.1rem}.ab h2{font-size:1.5rem;margin:48px 0 16px}
.ab ul{list-style:none;padding:0;margin:0}.ab li{padding:14px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px}.ab li small{color:var(--muted);display:block}
.ab .chips{display:flex;flex-wrap:wrap;gap:8px}.ab .chips li{border:1px solid var(--line);border-radius:99px;padding:6px 16px}
.ft{background:var(--ink);color:#fff;padding:56px 0 32px}.ft a{color:#fff}
.ft .row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:32px}.ft ul{list-style:none;padding:0;margin:0}.ft li{margin:4px 0}
.ft small{display:block;margin-top:40px;color:#9aa0a8}
@media(max-width:820px){
.burger{display:block}.nav{display:none;position:absolute;top:72px;left:0;right:0;background:#fff;flex-direction:column;align-items:flex-start;padding:20px var(--pad);border-bottom:1px solid var(--line)}
.nav.open{display:flex}.cols{grid-template-columns:1fr;gap:24px}.gallery{columns:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.svc p{margin:4px 0 0;color:var(--muted)}.svc strong{font:700 1.15rem 'Bricolage Grotesque'}
.edbtn{position:fixed;right:16px;bottom:16px;z-index:30;background:#fff;color:var(--ink);border:1px solid var(--ink);border-radius:99px;padding:8px 18px;font:600 .9rem Figtree;cursor:pointer}.edbtn:hover{background:var(--ink);color:#fff}
.ab{padding:clamp(40px,7vw,96px) 0 80px}
.ab-hero h1{font-size:clamp(2.6rem,8vw,6.5rem);max-width:14ch}
.ab-hero .lead{font:500 clamp(1.3rem,3vw,2.1rem)/1.3 'Bricolage Grotesque';max-width:30ch;margin:24px 0 0}
.ab-grid{display:grid;grid-template-columns:minmax(0,380px) 1fr;gap:clamp(28px,6vw,88px);margin:clamp(40px,6vw,80px) 0;align-items:start}
.pic{position:relative;margin:0 14px 14px 0}.pic::before{content:'';position:absolute;inset:14px -14px -14px 14px;background:var(--accent);border-radius:var(--r)}
.pic .foto{position:relative;aspect-ratio:4/5;border-radius:var(--r);overflow:hidden;background:var(--soft)}.pic img{width:100%;height:100%;object-fit:cover}
.ab .nome{font-size:clamp(1.6rem,3.5vw,2.4rem);margin:0}.ab .cargo{color:var(--muted);font-size:1.15rem;margin:4px 0 24px}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:24px}
.role{border-top:3px solid var(--accent);padding-top:16px}.role h3{font-size:1.6rem}.role p{color:var(--muted);margin:8px 0 0}
.ab .chans li{padding:0}.chans a{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:18px 0;text-decoration:none;font:500 clamp(1.3rem,3vw,1.9rem) 'Bricolage Grotesque';transition:padding .25s,color .25s}
.chans a:hover{color:var(--accent);padding-left:12px}.chans small{font:400 1rem Figtree;color:var(--muted)}
.mail{display:inline-block;font:700 clamp(1.5rem,4vw,2.8rem) 'Bricolage Grotesque';text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:8px;text-decoration-thickness:3px}
.teaser{display:grid;grid-template-columns:minmax(0,220px) 1fr;gap:clamp(20px,5vw,64px);align-items:center;border-top:1px solid var(--line);padding:56px 0 96px}
.teaser .foto{aspect-ratio:1;border-radius:50%;overflow:hidden;background:var(--soft)}.teaser img{width:100%;height:100%;object-fit:cover}
.teaser h2{font-size:clamp(1.8rem,4vw,3rem)}.teaser p{max-width:52ch;color:var(--muted);font-size:1.15rem;margin:12px 0 20px}
@media(max-width:820px){.ab-grid,.teaser{grid-template-columns:1fr}.pic{max-width:340px}.teaser .foto{width:140px}}
</style>
</head>
<body data-page="home">
<div id="header"></div>
<main id="main" tabindex="-1"><noscript>Ative o JavaScript para ver o conteúdo.</noscript></main>
<div id="footer"></div>

<script type="module">
const STAGED = {};
let LIVE = {
  "site": {
    "nome": "Emanoelle Vasconcelos",
    "descricao": "Portfólio de design gráfico, identidade visual e direção de arte por Emanoelle Vasconcelos.",
    "corDestaque": "#2f4bff",
    "logo": "",
    "imagemCompartilhamento": "",
    "menu": [{"label": "Projetos", "href": "/"}, {"label": "Quem sou", "href": "/sobre"}],
    "botao": {"label": "Fale comigo", "href": "mailto:emanoellevasc@gmail.com"},
    "hero": {"titulo": "{n} projetos criados com propósito", "subtitulo": "Design gráfico, identidade visual e direção de arte. Filtre por segmento e explore os trabalhos."},
    "contato": {"email": "emanoellevasc@gmail.com", "whatsapp": "", "cidades": []},
    "redes": [
      {"nome": "Behance", "url": "https://www.behance.net/emanoellevasconc", "detalhe": "Portfólio de projetos"},
      {"nome": "LinkedIn", "url": "https://www.linkedin.com/in/emanoelle-v-845a2b234/", "detalhe": "Perfil profissional"}
    ],
    "rodape": "© Emanoelle Vasconcelos. Todos os direitos reservados.",
    "mostrarBotaoEditar": true
  },
  "about": {
    "titulo": "Por trás dos projetos",
    "nome": "Emanoelle Vasconcelos",
    "cargo": "Designer e artista gráfica",
    "foto": "",
    "bio": [
      "Designer e artista gráfica, formada em Artes Visuais pela UFMG. Trabalho com design gráfico, identidade visual, direção de arte e comunicação, sempre buscando unir conceito e linguagem visual de uma forma que faça sentido para cada projeto.",
      "Minha formação em artes também influencia bastante o meu processo, principalmente na pesquisa, na experimentação e no uso de técnicas manuais junto ao digital. Gosto de desenvolver projetos com personalidade, pensando não só na estética, mas também na maneira como aquela ideia será percebida e communicated."
    ],
    "destaque": "Unindo conceito, arte e comunicação gráfica para criar projetos com personalidade.",
    "papeis": [
      {"titulo": "Designer Gráfica", "texto": "Identidade visual, direção de arte, comunicação visual e projetos conceituais."},
      {"titulo": "Artista Gráfica", "texto": "Pesquisa, experimentação, técnicas manuais e integração com o meio digital."}
    ],
    "secoes": [],
    "contatoTitulo": "Vamos conversar?",
    "servicosTitulo": "Serviços",
    "linksTitulo": "Onde me encontrar",
    "chamada": "Conheça minha história",
    "mostrarNaHome": true
  },
  "services": [
    {"titulo": "Identidade Visual", "descricao": "Criação de marcas, sistemas visuais e universos gráficos autênticos."},
    {"titulo": "Direção de Arte", "descricao": "Conceituação visual e linguagem para campanhas, eventos e lançamentos."},
    {"titulo": "Design Gráfico & Comunicação", "descricao": "Projetos editoriais, materiais promocionais e peças gráficas."}
  ],
  "categories": [
    {"id": "musica-e-festivais", "nome": "Música & Festivais"},
    {"id": "moda-e-estilo", "nome": "Moda & Estilo"},
    {"id": "esportes", "nome": "Esportes"},
    {"id": "jogos-eletronicos-e-esports", "nome": "Jogos Eletrônicos & E-sports"},
    {"id": "bares-e-restaurantes", "nome": "Bares & Restaurantes"}
  ],
  "projects": [
    {
      "slug": "projeto-exemplo",
      "nome": "Projeto de Exemplo",
      "cliente": "Cliente Modelo",
      "ano": "2026",
      "local": "",
      "categoria": "musica-e-festivais",
      "descricao": ["Este é um projeto de exemplo para você ver a estrutura. Clique em 'Editar' para substituir pelas suas imagens e informações."],
      "imagemPrincipal": "",
      "galeria": [],
      "links": [{"rotulo": "Ver no Behance", "url": "https://www.behance.net/emanoellevasconc"}],
      "info": []
    }
  ]
};

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const src = p => STAGED[p] || ((/^(https?:)?\/\//.test(p) || p.startsWith('/')) ? p : '/' + p);
const load = f => Promise.resolve(LIVE[f]);
const ROUTE = () => location.hash.slice(1).replace(/\/$/, '') || '/';
const PAGE = () => ROUTE() === '/sobre' ? 'about' : ROUTE().startsWith('/projetos/') ? 'project' : 'home';
const list = v => Array.isArray(v) ? v : (v ? [v] : []);
const catOf = (cats, id) => cats.find(c => c.id === id)?.nome || '';
const ph = t => `<div class="ph" role="img" aria-label="${esc(t)}" style="--h:${[...t].reduce((a, c) => a + c.charCodeAt(0), 0) % 360}">${esc((t || '?')[0])}</div>`;
const img = (p, alt) => p ? `<img src="${esc(src(p))}" alt="${esc(alt)}" loading="lazy" decoding="async">` : ph(alt);

function meta(site, title, desc, image) {
  document.title = title ? `${title} | ${site.nome}` : site.nome;
  const set = (sel, v) => { const m = $(sel); if (m && v) m.setAttribute('content', v) };
  set('meta[name=description]', desc || site.descricao);
  set('meta[property="og:title"]', document.title);
  set('meta[property="og:description"]', desc || site.descricao);
  set('meta[property="og:image"]', image ? location.origin + src(image) : '');
}

const contactLinks = site => {
  const c = site.contato || {}, out = [];
  if (c.email) out.push(`<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`);
  if (c.whatsapp) out.push(`<a href="https://wa.me/${esc(c.whatsapp)}">WhatsApp</a>`);
  list(site.redes).forEach(r => r.url && out.push(`<a href="${esc(r.url)}" rel="noopener" target="_blank">${esc(r.nome)}</a>`));
  return out;
};

function editBtn(site) {
  if ($('.edbtn') || (site.mostrarBotaoEditar === false && !/[?&]editar/.test(location.search))) return;
  const b = Object.assign(document.createElement('button'), { className: 'edbtn', textContent: 'Editar' });
  b.onclick = () => openEditor();
  document.body.append(b);
}

function layout(site) {
  document.documentElement.style.setProperty('--accent', site.corDestaque || '#2f4bff');
  const path = ROUTE();
  const cur = h => h === path || (h === '/' && path.startsWith('/projetos'));
  const b = site.botao;
  $('#header').innerHTML = `<a class="skip" href="#main">Ir para o conteúdo</a>
  <header class="hd"><div class="wrap"><a class="logo" href="/#">${site.logo ? `<img src="${esc(src(site.logo))}" alt="${esc(site.nome)}">` : esc(site.nome)}</a>
  <button class="burger" aria-expanded="false" aria-controls="nav">Menu</button>
  <nav class="nav" id="nav" aria-label="Principal">${list(site.menu).map(m => `<a href="/#${esc(m.href)}"${cur(m.href) ? ' aria-current="page"' : ''}>${esc(m.label)}</a>`).join('')}
  ${b && b.label ? `<a class="btn" href="${esc(b.href)}">${esc(b.label)}</a>` : ''}</nav></div></header>`;
  const bg = $('.burger'), nav = $('#nav');
  bg.onclick = () => bg.setAttribute('aria-expanded', nav.classList.toggle('open'));
  $('#footer').innerHTML = `<footer class="ft"><div class="wrap"><div class="row"><div><strong>${esc(site.nome)}</strong><br>${list(site.contato?.cidades).map(esc).join(' · ')}</div>
  <ul>${contactLinks(site).map(l => `<li>${l}</li>`).join('')}</ul></div><small>${esc(site.rodape)}</small></div></footer>`;
  editBtn(site);
}

const card = (p, cats) => `<a class="card" href="/#/projetos/${esc(p.slug)}" data-cat="${esc(p.categoria)}"><div class="thumb">${img(p.imagemPrincipal, p.nome)}</div>
  <h3>${esc(p.nome)}${p.local ? `<span>, ${esc(p.local)}</span>` : ''}</h3><p class="cat">${esc(catOf(cats, p.categoria))}</p></a>`;

async function home(site, main) {
  const [ps, cats, ab] = await Promise.all([load('projects'), load('categories'), load('about')]);
  const used = cats.filter(c => ps.some(p => p.categoria === c.id));
  meta(site, '', site.descricao, ps[0]?.imagemPrincipal || site.imagemCompartilhamento);
  main.innerHTML = `<div class="wrap"><section class="hero"><h1>${esc(site.hero.titulo.replace('{n}', ps.length))}</h1><p>${esc(site.hero.subtitulo)}</p></section>
  <div class="filters" role="group" aria-label="Filtrar por segmento">${[{ id: '', nome: 'Todos' }, ...cats].map((c, i) => `<button aria-pressed="${i === 0}" data-c="${esc(c.id)}">${esc(c.nome)}</button>`).join('')}</div>
  <div class="grid" id="grid" aria-live="polite">${ps.map(p => card(p, cats)).join('')}</div>
  ${ab.mostrarNaHome !== false ? `<section class="teaser"><div class="foto">${img(ab.foto, ab.nome)}</div><div><h2>${esc(ab.titulo)}</h2><p>${esc(ab.destaque || list(ab.bio)[0] || '')}</p><a class="btn" href="/#/sobre">${esc(ab.chamada || 'Conheça minha história')}</a></div></section>` : ''}</div>`;
  const grid = $('#grid');
  main.querySelectorAll('.filters button').forEach(b => b.onclick = () => {
    main.querySelectorAll('.filters button').forEach(x => x.setAttribute('aria-pressed', x === b));
    grid.querySelectorAll('.card').forEach(c => c.hidden = !!b.dataset.c && c.dataset.cat !== b.dataset.c);
  });
}

async function project(site, main) {
  const [ps, cats] = await Promise.all([load('projects'), load('categories')]);
  const slug = ROUTE().split('/').filter(Boolean).pop();
  const i = ps.findIndex(p => p.slug === slug), p = ps[i];
  if (!p) { meta(site, 'Projeto não encontrado'); main.innerHTML = `<div class="wrap"><p class="empty">Projeto não encontrado. <a href="/#">Ver todos os projetos</a></p></div>`; return; }
  const txt = list(p.descricao), gal = list(p.galeria), links = list(p.links).filter(l => l.url);
  const rows = [['Cliente', p.cliente], ['Ano', p.ano], ...list(p.info).map(x => [x.rotulo, x.valor])].filter(r => r[0] && r[1]);
  meta(site, p.nome, txt[0], p.imagemPrincipal);
  const nb = (q, l) => q ? `<a href="/#/projetos/${esc(q.slug)}">${l} ${esc(q.nome)}</a>` : '<span></span>';
  main.innerHTML = `<article class="wrap pj"><a class="back" href="/#">← Todos os projetos</a><h1>${esc(p.nome)}</h1>
  <p class="sub">${[catOf(cats, p.categoria), p.local].filter(Boolean).map(esc).join(', ')}</p>
  <div class="cover">${img(p.imagemPrincipal, p.nome)}</div>
  <div class="cols"><div>${txt.map(t => `<p>${esc(t)}</p>`).join('')}</div><div>${rows.length ? `<dl>${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>` : ''}
  ${links.length ? `<div class="links">${links.map(l => `<a class="btn" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.rotulo || 'Ver projeto')}</a>`).join('')}</div>` : ''}</div></div>
  ${gal.length ? `<div class="gallery">${gal.map((g, n) => `<button data-n="${n}" aria-label="Ampliar imagem">${img(g, `${p.nome} – imagem ${n + 1}`)}</button>`).join('')}</div>` : ''}
  <nav class="pn" aria-label="Outros projetos">${nb(ps[i - 1], '←')}${nb(ps[i + 1], '')}</nav></article>
  <dialog id="lb" aria-label="Imagem ampliada"></dialog>`;
  const lb = $('#lb');
  main.querySelectorAll('.gallery button').forEach(b => b.onclick = () => { lb.innerHTML = img(gal[b.dataset.n], p.nome); lb.showModal() });
  lb.onclick = () => lb.close();
}

async function about(site, main) {
  const [a, sv] = await Promise.all([load('about'), load('services')]);
  meta(site, a.titulo, a.destaque || list(a.bio)[0], a.foto);
  const c = site.contato || {}, redes = list(site.redes).filter(r => r.url);
  main.innerHTML = `<div class="wrap ab">
  <header class="ab-hero"><h1>${esc(a.titulo)}</h1>${a.destaque ? `<p class="lead">${esc(a.destaque)}</p>` : ''}</header>
  <div class="ab-grid"><figure class="pic"><div class="foto">${img(a.foto, a.nome)}</div></figure>
  <div><h2 class="nome">${esc(a.nome)}</h2><p class="cargo">${esc(a.cargo)}</p>${list(a.bio).map(t => `<p>${esc(t)}</p>`).join('')}</div></div>
  ${list(a.papeis).length ? `<div class="roles">${a.papeis.map(r => `<div class="role"><h3>${esc(r.titulo)}</h3><p>${esc(r.texto)}</p></div>`).join('')}</div>` : ''}
